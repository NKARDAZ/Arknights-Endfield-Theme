<!-- ============ 1. КОММЕНТАРИИ ============ -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- метаданные -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Тестовая страница для проверки темы" />
  <title>Тест темы</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- ============ 2. ВНУТРЕННИЕ СТИЛИ ============ -->
  <style>
    :root { --primary: #3498db; }
    body { font-family: sans-serif; background: #f5f5f5; }
    .highlight { color: red; font-weight: bold; }
    #main-id { padding: 1rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body data-theme="light" class="page loaded">

  <!-- ============ 3. СЕМАНТИЧЕСКИЕ ТЕГИ И АТРИБУТЫ ============ -->
  <header id="main-header" class="site-header">
    <nav aria-label="основная навигация">
      <ul>
        <li><a href="#home" class="active">Главная</a></li>
        <li><a href="https://example.com" target="_blank" rel="noopener">Внешняя ссылка</a></li>
      </ul>
    </nav>
    <h1>Проверка подсветки синтаксиса</h1>
  </header>

  <main>
    <!-- ============ 4. ТЕКСТОВЫЕ ЭЛЕМЕНТЫ ============ -->
    <p>Пример текста с <strong>жирным</strong>, <em>курсивом</em> и <code>инлайн-кодом</code>.</p>
    <blockquote cite="https://example.com">Цитата откуда-то.</blockquote>
    <pre><code>function example() { return 1; }</code></pre>

    <!-- ============ 5. СПИСКИ И ТАБЛИЦЫ ============ -->
    <ul>
      <li class="item active" data-index="0">Пункт 1</li>
      <li class="item">Пункт 2</li>
    </ul>

    <table border="1">
      <thead>
        <tr><th>Заголовок 1</th><th>Заголовок 2</th></tr>
      </thead>
      <tbody>
        <tr><td>Ячейка 1</td><td>Ячейка 2</td></tr>
      </tbody>
    </table>

    <!-- ============ 6. ФОРМА СО ВСЕМИ ТИПАМИ АТРИБУТОВ ============ -->
    <form action="/submit" method="post" enctype="multipart/form-data" novalidate>
      <input type="text" name="username" placeholder="Имя" required minlength="3" />
      <input type="email" name="email" disabled value="test@example.com" />
      <input type="checkbox" name="agree" checked />
      <input type="range" min="0" max="100" step="5" />
      <select name="options">
        <option value="1" selected>Первый</option>
        <option value="2">Второй</option>
      </select>
      <textarea rows="4" cols="50"></textarea>
      <button type="submit" onclick="return false;">Отправить</button>
      <button type="button" disabled>Отключено</button>
    </form>

    <!-- ============ 7. МЕДИА И ВЛОЖЕННЫЕ ЭЛЕМЕНТЫ ============ -->
    <img src="image.png" alt="Описание изображения" width="200" height="100" loading="lazy" />
    <figure>
      <img src="photo.jpg" alt="Фото" />
      <figcaption>Подпись к фото</figcaption>
    </figure>
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="blue" />
    </svg>

    <!-- ============ 8. ПОЛЬЗОВАТЕЛЬСКИЕ ЭЛЕМЕНТЫ И ШАБЛОНЫ ============ -->
    <custom-element data-value="123"></custom-element>
    <template id="my-template">
      <div class="template-content"></div>
    </template>

    <!-- ============ 9. СКРИПТЫ ============ -->
    <script src="external.js" defer></script>
    <script type="module">
      import { init } from "./app.js";
      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.querySelector("button");
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          console.log("Кнопка нажата");
        });
        init();
      });
    </script>

    <!-- условный комментарий (для старых версий IE, историческая справка) -->
    <!--[if IE]>
    <p>Вы используете Internet Explorer.</p>
    <![endif]-->
  </main>

  <footer>&copy; 2026 Тестовая страница &mdash; все права защищены</footer>
</body>
</html>
